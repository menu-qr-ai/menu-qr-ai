<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Menú App</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: system-ui, -apple-system, sans-serif;
    background: #0a0b10;
    color: white;
}

/* TOP BAR */
.topbar {
    position: sticky;
    top: 0;
    background: rgba(10,11,16,0.95);
    backdrop-filter: blur(10px);
    padding: 14px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    z-index: 10;
}

.topbar h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 800;
}

/* SEARCH */
.search {
    margin-top: 10px;
}

.search input {
    width: 100%;
    padding: 10px;
    border-radius: 10px;
    border: none;
    outline: none;
    background: #141622;
    color: white;
}

/* CATEGORY SCROLL */
.categories {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding: 10px 14px;
}

.cat {
    white-space: nowrap;
    padding: 8px 12px;
    border-radius: 999px;
    background: #141622;
    font-size: 12px;
    cursor: pointer;
}

/* MENU */
#menu {
    padding: 14px;
    max-width: 800px;
    margin: auto;
}

/* CARD */
.card {
    display: flex;
    gap: 12px;
    background: #141622;
    border-radius: 14px;
    overflow: hidden;
    margin-bottom: 12px;
}

.card img {
    width: 100px;
    height: 100px;
    object-fit: cover;
}

.content {
    padding: 10px;
    flex: 1;
}

.title {
    font-weight: 800;
    font-size: 14px;
}

.desc {
    font-size: 12px;
    color: #aaa;
    margin-top: 4px;
}

.bottom {
    display: flex;
    justify-content: space-between;
    margin-top: 8px;
}

.price {
    color: #4ade80;
    font-weight: 700;
}

.badge {
    font-size: 10px;
    color: #ff6b6b;
}

/* ANIMATION */
.card {
    transition: transform 0.15s ease;
}

.card:active {
    transform: scale(0.98);
}
</style>

</head>

<body>

<div class="topbar">
    <h1>🍽️ Restaurante App</h1>
    <div class="search">
        <input id="search" placeholder="Buscar plato...">
    </div>
</div>

<div class="categories" id="cats"></div>

<div id="menu">Cargando...</div>

<script>
const API = "https://menu-qr-ai.onrender.com";

let allDishes = [];
let allCats = [];

async function load() {

    allCats = await fetch(API + "/categories").then(r => r.json());
    allDishes = await fetch(API + "/dishes").then(r => r.json());

    renderCategories();
    renderMenu();
}

function renderCategories() {

    const el = document.getElementById("cats");
    el.innerHTML = "";

    allCats.forEach(c => {
        const div = document.createElement("div");
        div.className = "cat";
        div.innerText = c.name;

        div.onclick = () => {
            renderMenu(c.id);
        };

        el.appendChild(div);
    });
}

function renderMenu(filterId = null) {

    const menu = document.getElementById("menu");
    menu.innerHTML = "";

    let dishes = allDishes;

    if (filterId) {
        dishes = dishes.filter(d => d.category_id === filterId);
    }

    dishes.forEach(d => {

        menu.innerHTML += `
        <div class="card">
            <img src="${d.image || 'https://images.unsplash.com/photo-1540189549336-e6e99c3679fe'}">

            <div class="content">
                <div class="title">${d.name}</div>
                <div class="desc">${d.description}</div>

                <div class="bottom">
                    <div class="price">${d.price} €</div>
                    <div class="badge">${d.allergens || ''}</div>
                </div>
            </div>
        </div>`;
    });
}

/* SEARCH */
document.addEventListener("input", (e) => {

    if (e.target.id === "search") {

        const val = e.target.value.toLowerCase();

        const filtered = allDishes.filter(d =>
            d.name.toLowerCase().includes(val)
        );

        const menu = document.getElementById("menu");
        menu.innerHTML = "";

        filtered.forEach(d => {
            menu.innerHTML += `
            <div class="card">
                <img src="${d.image}">
                <div class="content">
                    <div class="title">${d.name}</div>
                    <div class="desc">${d.description}</div>
                    <div class="bottom">
                        <div class="price">${d.price} €</div>
                        <div class="badge">${d.allergens || ''}</div>
                    </div>
                </div>
            </div>`;
        });
    }
});

load();
</script>

</body>
</html>
