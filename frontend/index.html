<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Menú Restaurante</title>

    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            background: #f6f6f6;
            color: #222;
        }

        header {
            background: #111;
            color: white;
            padding: 18px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }

        #menu {
            max-width: 600px;
            margin: auto;
            padding: 15px;
        }

        .category-title {
            margin: 20px 0 10px;
            font-size: 18px;
            font-weight: 700;
            border-left: 4px solid #ff4d4d;
            padding-left: 10px;
        }

        .dish {
            background: white;
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .dish h3 {
            margin: 0;
            font-size: 16px;
        }

        .desc {
            font-size: 13px;
            color: #666;
            margin: 6px 0;
        }

        .price {
            font-weight: bold;
            color: #1a7f37;
        }

        .badge {
            display: inline-block;
            margin-top: 6px;
            background: #ffe8e8;
            color: #b30000;
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<header>🍽️ Menú del Restaurante</header>

<div id="menu"></div>

<script>
async function loadMenu() {
    const dishes = await fetch("/dishes").then(r => r.json());
    const categories = await fetch("/categories").then(r => r.json());

    const menu = document.getElementById("menu");
    menu.innerHTML = "";

    categories.forEach(cat => {

        const section = document.createElement("div");

        const title = document.createElement("div");
        title.className = "category-title";
        title.innerText = cat.name;

        section.appendChild(title);

        dishes
            .filter(d => d.category_id === cat.id)
            .forEach(d => {

                const card = document.createElement("div");
                card.className = "dish";

                card.innerHTML = `
                    <h3>${d.name}</h3>
                    <div class="desc">${d.description}</div>
                    <div class="price">${d.price} €</div>
                    <div class="badge">⚠️ ${d.allergens}</div>
                `;

                section.appendChild(card);
            });

        menu.appendChild(section);
    });
}

loadMenu();
</script>

</body>
</html>
