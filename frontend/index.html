<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Menú Restaurante</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        :root {
            --bg: #0e0f12;
            --card: #171922;
            --text: #f2f2f2;
            --muted: #a9a9a9;
            --accent: #ff5a5f;
            --price: #4ade80;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        header {
            padding: 28px 16px 14px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 800;
        }

        header p {
            margin: 6px 0 0;
            font-size: 13px;
            color: var(--muted);
        }

        #menu {
            max-width: 720px;
            margin: auto;
            padding: 16px;
        }

        .category {
            margin-top: 26px;
        }

        .category-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 12px;
            border-left: 3px solid var(--accent);
            padding-left: 10px;
        }

        .card {
            background: var(--card);
            border-radius: 14px;
            overflow: hidden;
            margin-bottom: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.35);
        }

        .card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
        }

        .content {
            padding: 12px;
        }

        .title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .desc {
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 10px;
        }

        .bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .price {
            font-weight: 700;
            color: var(--price);
        }

        .badge {
            font-size: 10px;
            background: rgba(255,90,95,0.12);
            color: var(--accent);
            padding: 4px 8px;
            border-radius: 999px;
        }

        footer {
            text-align: center;
            padding: 22px;
            font-size: 11px;
            color: #666;
        }
    </style>
</head>

<body>

<header>
    <h1>🍽️ Restaurante Digital</h1>
    <p>Elige, disfruta y repite</p>
</header>

<div id="menu">Cargando menú...</div>

<footer>Hecho con FastAPI 🚀</footer>

<script>
async function loadMenu() {

    // ✅ CORREGIDO: endpoints correctos
    const cats = await fetch("https://menu-qr-ai.onrender.com/categories").then(r => r.json());
    const dishes = await fetch("https://menu-qr-ai.onrender.com/dishes").then(r => r.json());

    const menu = document.getElementById("menu");
    menu.innerHTML = "";

    cats.forEach(cat => {

        const section = document.createElement("div");
        section.className = "category";

        let html = `<div class="category-title">${cat.name}</div>`;

        dishes
            .filter(d => d.category_id === cat.id)
            .forEach(d => {

                html += `
                    <div class="card">
                        <img src="${d.image || 'https://images.unsplash.com/photo-1540189549336-e6e99c3679fe'}">

                        <div class="content">
                            <div class="title">${d.name}</div>
                            <div class="desc">${d.description}</div>

                            <div class="bottom">
                                <div class="price">${d.price} €</div>
                                <div class="badge">${d.allergens || ''}</div>
                            </div>
                        </div>
                    </div>
                `;
            });

        section.innerHTML = html;
        menu.appendChild(section);
    });
}

loadMenu();
</script>

</body>
</html>
