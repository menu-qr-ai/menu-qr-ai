# Render Blueprint: New > Blueprint > pick this repo > Apply.
# Free plan: the web service sleeps after 15 min idle and the free
# PostgreSQL database expires after 30 days. Upgrade both before real use.
databases:
  - name: hostai-db
    plan: free
    region: frankfurt
    databaseName: hostai
    user: hostai

services:
  - type: web
    name: hostai
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: bash scripts/render_start.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: hostai-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: SEED_DEMO_ON_EMPTY
        value: "true"
      # Password of owner@demo.hostai.local, readable in the Render dashboard.
      - key: DEMO_OWNER_PASSWORD
        generateValue: true
      - key: LOG_LEVEL
        value: INFO
      # Optional: enables AI translations and leftover ideas.
      - key: OPENAI_API_KEY
        sync: false
