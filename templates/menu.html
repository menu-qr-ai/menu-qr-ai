<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Menu</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body { font-family: Arial; margin: 20px; }
        .dish { border: 1px solid #ddd; padding: 12px; margin-bottom: 12px; border-radius: 8px; }
        .dish img { width: 120px; border-radius: 8px; }
        .btn { margin-top: 8px; padding: 6px 10px; background: #111; color: white; border: none; border-radius: 6px; cursor: pointer; }
        .small { font-size: 12px; color: #666; }
    </style>
</head>

<body>

<h1>🍽️ Menu</h1>

<div id="menu"></div>

<script>
    const dishes = {{ dishes | tojson }};
    
    function render() {
        const container = document.getElementById("menu");
        container.innerHTML = "";

        dishes.forEach(d => {
            container.innerHTML += `
                <div class="dish">
                    <h3>${d.name}</h3>
                    <img src="${d.image}">
                    <p>${d.description}</p>

                    <p class="small" id="text-${d.id}">
                        ${d.ingredients} | ${d.allergens}
                    </p>

                    <button class="btn" onclick="translateDish(${d.id})">
                        🌍 Traducir
                    </button>
                </div>
            `;
        });
    }

    async function translateDish(id) {
        const lang = navigator.language || "en";

        const res = await fetch(`/ai/translate-dish/${id}?lang=${lang}`);
        const data = await res.json();

        if (data.error) {
            alert("Error traduciendo");
            return;
        }

        document.getElementById("text-" + id).innerHTML =
            `${data.ingredients} | ${data.allergens}
            <br><strong>${data.description}</strong>`;
    }

    render();
</script>

</body>
</html>
