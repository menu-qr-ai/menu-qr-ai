<!DOCTYPE html>
<html lang="{{ lang }}">

<head>
    <meta charset="UTF-8">
    <title>Menu</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<header>
    <h1>🍽️ Restaurante Inteligente</h1>

    <div class="meta">
        Restaurante: {{ restaurant_id }} |
        Mesa: {{ table }} |
        Idioma: {{ lang }}
    </div>
</header>

<div id="menu"></div>

<script>

const dishes = {{ dishes | safe }};
const categories = {{ categories | safe }};
const lang = "{{ lang }}";

const menu = document.getElementById("menu");

let html = "";

/* -------------------------
   RENDER BASE MENU
------------------------- */
categories.forEach(c => {

    html += `<h2>${c.name}</h2>`;

    dishes
        .filter(d => d.category_id === c.id)
        .forEach(d => {

            html += `
                <div class="card">

                    <img src="${d.image}">

                    <div class="content">

                        <h3 id="name-${d.id}">
                            ${d.name}
                        </h3>

                        <p id="desc-${d.id}">
                            ${d.description}
                        </p>

                        <p>
                            <b>Ingredientes:</b>
                            <span id="ing-${d.id}">
                                ${d.ingredients || "No disponibles"}
                            </span>
                        </p>

                        <p>
                            <b>Alérgenos:</b>
                            <span id="all-${d.id}">
                                ${d.allergens || "No especificados"}
                            </span>
                        </p>

                        <b>${d.price}€</b>

                    </div>
                </div>
            `;
        });
});

menu.innerHTML = html;

/* -------------------------
   IA TRANSLATION LAYER
------------------------- */
async function translateDish(dishId) {

    try {

        const res = await fetch(
            `/ai/translate-dish/${dishId}?lang=${lang}`
        );

        const data = await res.json();

        if (data.error) return;

        const nameEl = document.getElementById(`name-${dishId}`);
        const descEl = document.getElementById(`desc-${dishId}`);
        const ingEl = document.getElementById(`ing-${dishId}`);
        const allEl = document.getElementById(`all-${dishId}`);

        if (nameEl) nameEl.innerText = data.name || nameEl.innerText;
        if (descEl) descEl.innerText = data.description || descEl.innerText;
        if (ingEl) ingEl.innerText = data.ingredients || ingEl.innerText;
        if (allEl) allEl.innerText = data.allergens || allEl.innerText;

    } catch (err) {
        console.log("Translation error:", err);
    }
}

/* -------------------------
   AUTO TRANSLATE (IF NEEDED)
------------------------- */
if (lang !== "es") {

    dishes.forEach(d => {
        translateDish(d.id);
    });

}

</script>

</body>
</html>
